<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArcVoice Convertor: Premium</title>

    <!-- CSS -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        background: #eef3fb;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        padding: 50px 20px;
      }

      .container {
        width: 90%;
        max-width: 1200px;
        text-align: center;
      }

      h1 {
        font-size: 48px;
        color: #0d6efd;
        margin-bottom: 30px;
      }

      button {
        background: #0d6efd;
        color: white;
        border: none;
        padding: 15px 35px;
        font-size: 20px;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s ease;
      }

      .buttons {
        margin-bottom: 30px;
      }

      .buttons button {
        margin: 0 10px;
      }

      button:hover {
        background: #0b5ed7;
        transform: translateY(-2px);
      }

      #output:empty::before {
        content: "Start speaking... your homework notes will appear here.";
        color: #a6a6ed;
      }

      #output {
        width: 100%;
        min-height: 220px;
        margin-top: 35px;
        padding: 20px;
        background: white;
        border: 3px dashed #0d6efd;
        border-radius: 8px;
        text-align: left;
        font-size: 22px;
        line-height: 1.6;
        color: #333;
        overflow-y: auto;
        overflow-wrap: break-word;
        white-space: pre-wrap;
      }

      .tip {
        margin-top: 25px;
        color: #666;
        font-size: 18px;
      }

      /* ---------- Responsive Design ---------- */

      @media (max-width: 768px) {
        h1 {
          font-size: 36px;
        }

        button {
          width: 100%;
          max-width: 280px;
          font-size: 18px;
        }

        #output {
          font-size: 18px;
          min-height: 180px;
        }

        .tip {
          font-size: 16px;
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 30px 15px;
        }

        h1 {
          font-size: 30px;
        }

        button {
          padding: 14px 25px;
          font-size: 16px;
        }

        #output {
          font-size: 16px;
          min-height: 160px;
          padding: 15px;
        }

        .tip {
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Speech to Text</h1>

      <div class="buttons">
        <button onclick="start()">Start Listening</button>
        <button onclick="stop()">Stop Listening</button>
      </div>

      <div id="output"></div>

      <p class="tip">Tip: Speak slowly and clearly for best results.</p>
    </div>

    <script>
      let recognition;

      function start() {
        recognition = new window.webkitSpeechRecognition();

        let output = document.getElementById("output");

        output.innerHTML = ""; // Clears previous text

        recognition.continuous = true;
        recognition.interimResults = false;
        recognition.lang = "en-US";

        recognition.onstart = function () {
          if (
            output.innerHTML ===
              "Start speaking... your homework notes will appear here." ||
            output.innerHTML === "🎤 Listening..."
          ) {
            output.innerHTML = "";
          }
        };

        recognition.onresult = function (event) {
          let text = event.results[event.results.length - 1][0].transcript;

          output.innerHTML += text + " ";
        };

        recognition.start();
      }

      function stop() {
        if (recognition) {
          recognition.stop();
        }
      }
    </script>
  </body>
</html>
